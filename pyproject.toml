[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcblueprint"
dynamic = ["version"]
description = "AI コーディングエージェント向けの Minecraft 建築設計ツールキット。Blueprint JSON から .schem を生成する。"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "rs0325" }]
keywords = ["minecraft", "schematic", "worldedit", "blueprint"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "nbtlib>=2.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
preview = [
  "Pillow>=10.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "Pillow>=10.0",
]

[project.scripts]
mcblueprint = "mcblueprint.cli:main"

[project.urls]
Repository = "https://github.com/rs0325/MCBlueprint"
Issues = "https://github.com/rs0325/MCBlueprint/issues"

[tool.hatch.version]
path = "src/mcblueprint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcblueprint"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
